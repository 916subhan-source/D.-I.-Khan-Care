services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dikhan_care_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY:-dikhan-production-secret-key-change-in-prod}
      - DATABASE_URL=sqlite+aiosqlite:////app/backend/dikhan_care.db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://76.13.18.85:32768}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-u8lzdSknWYziUvBemQX1hOBvTGGMSPkN}
      - EVOLUTION_INSTANCE_NAME=D. I. khan Care
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend/dikhan_care.db:/app/backend/dikhan_care.db
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: dikhan_care_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
