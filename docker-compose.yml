services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dikhan_care_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=dikhan-production-secret-replace-with-64-character-string
      - DATABASE_URL=sqlite+aiosqlite:////app/data/dikhan_care.db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: dikhan_care_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  app_data:
  redis_data:
