<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Luxury Teal to Vibrant Emerald -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Medical Pulse Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>

    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGradient)" filter="url(#glow)"/>

  <!-- Subtle Inner Glass Ring -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="6"/>

  <!-- Elegant Medical Cross Body -->
  <g filter="url(#glow)">
    <!-- Vertical Cross Bar -->
    <rect x="216" y="112" width="80" height="288" rx="28" fill="url(#crossGrad)"/>
    <!-- Horizontal Cross Bar -->
    <rect x="112" y="216" width="288" height="80" rx="28" fill="url(#crossGrad)"/>
  </g>

  <!-- Dynamic Vital Pulse Line (Heartbeat Rhythm) across Center -->
  <path d="M 120 256 L 195 256 L 220 180 L 256 330 L 285 225 L 305 275 L 325 256 L 392 256" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Glowing Heartbeat Node -->
  <circle cx="256" cy="330" r="10" fill="#38bdf8"/>
  <circle cx="220" cy="180" r="8" fill="#14b8a6"/>
</svg>
