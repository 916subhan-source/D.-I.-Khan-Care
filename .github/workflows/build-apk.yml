name: Build Android APK (D.I. Khan Care)

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Initialize Capacitor Android Project
        run: |
          cd frontend
          npm install --save @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "D.I. Khan Care" "io.dikhancare.app" --web-dir "dist"
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd frontend/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Download Artifacts
        run: |
          mkdir -p frontend/public/downloads
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/public/downloads/dikhan-care.apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk DIK-Care-v1.0.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIK-Care-v1.0.apk
          path: DIK-Care-v1.0.apk

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-app-v1.0
          name: "D.I. Khan Care Mobile App v1.0 (Android APK)"
          body: |
            ### 📱 D.I. Khan Care Android Mobile App
            Download and install the official D.I. Khan Care Android application directly onto any Android phone.
            
            - **Package:** `io.dikhancare.app`
            - **Version:** `1.0.0`
            - **Features:** Instant Doctor Booking, Live Queue Digital Tokens, SMS & WhatsApp Notifications.
          files: DIK-Care-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
